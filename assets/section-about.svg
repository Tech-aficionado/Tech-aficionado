<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h    { font: 700 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f5f3ff; }
      .item { font: 500 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #d8d4f0; }
      .bul  { fill: #9D7CFF; }
    </style>
  </defs>
  <rect width="900" height="300" rx="20" fill="#0d0e14"/>
  <rect x="2" y="2" width="896" height="296" rx="18" fill="none" stroke="#2a2440" stroke-width="2"/>

  <text x="40" y="54" class="h">🧑‍💻 About me</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="48" cy="92" r="4" class="bul"/>
    <text x="64" y="97" class="item">🚀 I like taking an idea all the way to users' hands — auth, payments, CI/CD, releases, monitoring included.</text>

    <circle cx="48" cy="126" r="4" class="bul"/>
    <text x="64" y="131" class="item">📱 Mostly working in Flutter, Next.js / TypeScript, Python (FastAPI), Supabase and Firebase.</text>

    <circle cx="48" cy="160" r="4" class="bul"/>
    <text x="64" y="165" class="item">🤖 Building AI features with LLM APIs (Groq, Gemini) behind secure server-side gateways — never keys in the client.</text>

    <circle cx="48" cy="194" r="4" class="bul"/>
    <text x="64" y="199" class="item">🌱 Currently exploring security tooling, offline-first architecture, and local on-device AI models.</text>

    <circle cx="48" cy="228" r="4" class="bul"/>
    <text x="64" y="233" class="item">🤝 Open to full-time roles and internships — fastest way to reach me is email.</text>

    <circle cx="48" cy="262" r="4" class="bul"/>
    <text x="64" y="267" class="item">📍 Muzaffarnagar, Uttar Pradesh, India</text>
  </g>
</svg>

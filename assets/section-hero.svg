<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e14"/>
      <stop offset="100%" stop-color="#17121f"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D7CFF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <style>
      .title { font: 700 40px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f5f3ff; }
      .sub   { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9c3e6; }
      .tag   { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9D7CFF; }
    </style>
  </defs>

  <rect width="900" height="260" rx="20" fill="url(#heroBg)"/>
  <rect x="2" y="2" width="896" height="256" rx="18" fill="none" stroke="url(#accentStroke)" stroke-width="2" opacity="0.6"/>

  <!-- animated accent orbit ring, GitHub-safe (pure SVG SMIL) -->
  <g transform="translate(790,60)">
    <circle r="34" fill="none" stroke="#9D7CFF" stroke-width="2" opacity="0.35"/>
    <circle r="3.5" fill="#9D7CFF">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <animateMotion dur="6s" repeatCount="indefinite" path="M 34 0 A 34 34 0 1 1 -34 0 A 34 34 0 1 1 34 0"/>
    </circle>
  </g>

  <text x="48" y="100" class="title">Hi, I'm Shivansh Goel 👋</text>
  <text x="48" y="138" class="sub">Full-Stack &amp; Mobile Developer · Final-year B.Tech CSE student, India 🇮🇳</text>

  <text x="48" y="178" class="tag" opacity="0">
    I ship real products, not demos
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.35" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="178" class="tag" opacity="0">
    Flutter · Next.js · Python · AI
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.65;0.7" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="178" class="tag" opacity="0">
    Open to full-time roles &amp; internships
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;1;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <text x="48" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8d87ad">📍 Muzaffarnagar, Uttar Pradesh, India</text>
</svg>

<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h     { font: 700 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f5f3ff; }
      .lbl   { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9D7CFF; }
      .chip  { font: 500 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e3e0f5; }
      .chipBg{ fill: #1a1726; stroke: #332b52; stroke-width: 1; }
    </style>
  </defs>
  <rect width="900" height="320" rx="20" fill="#0d0e14"/>
  <rect x="2" y="2" width="896" height="316" rx="18" fill="none" stroke="#2a2440" stroke-width="2"/>
  <text x="40" y="48" class="h">⚙️ Tech I use</text>

  <!-- row generator via manual groups (GitHub-safe, static layout) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="80" class="lbl">LANGUAGES</text>
    <g transform="translate(40,92)">
      <rect class="chipBg" width="58" height="28" rx="8"/><text x="29" y="19" text-anchor="middle" class="chip">Dart</text>
      <rect class="chipBg" x="66" width="50" height="28" rx="8"/><text x="91" y="19" text-anchor="middle" class="chip">TS</text>
      <rect class="chipBg" x="124" width="50" height="28" rx="8"/><text x="149" y="19" text-anchor="middle" class="chip">JS</text>
      <rect class="chipBg" x="182" width="78" height="28" rx="8"/><text x="221" y="19" text-anchor="middle" class="chip">Python</text>
      <rect class="chipBg" x="268" width="64" height="28" rx="8"/><text x="300" y="19" text-anchor="middle" class="chip">Java</text>
      <rect class="chipBg" x="340" width="64" height="28" rx="8"/><text x="372" y="19" text-anchor="middle" class="chip">C++</text>
    </g>

    <text x="40" y="150" class="lbl">FRONTEND &amp; MOBILE</text>
    <g transform="translate(40,162)">
      <rect class="chipBg" width="78" height="28" rx="8"/><text x="39" y="19" text-anchor="middle" class="chip">Flutter</text>
      <rect class="chipBg" x="86" width="88" height="28" rx="8"/><text x="130" y="19" text-anchor="middle" class="chip">Next.js</text>
      <rect class="chipBg" x="182" width="94" height="28" rx="8"/><text x="229" y="19" text-anchor="middle" class="chip">Tailwind</text>
      <rect class="chipBg" x="284" width="64" height="28" rx="8"/><text x="316" y="19" text-anchor="middle" class="chip">React</text>
    </g>

    <text x="40" y="220" class="lbl">BACKEND &amp; DATA</text>
    <g transform="translate(40,232)">
      <rect class="chipBg" width="98" height="28" rx="8"/><text x="49" y="19" text-anchor="middle" class="chip">FastAPI</text>
      <rect class="chipBg" x="106" width="96" height="28" rx="8"/><text x="154" y="19" text-anchor="middle" class="chip">Supabase</text>
      <rect class="chipBg" x="210" width="86" height="28" rx="8"/><text x="253" y="19" text-anchor="middle" class="chip">Firebase</text>
      <rect class="chipBg" x="304" width="96" height="28" rx="8"/><text x="352" y="19" text-anchor="middle" class="chip">Postgres</text>
      <rect class="chipBg" x="408" width="70" height="28" rx="8"/><text x="443" y="19" text-anchor="middle" class="chip">Redis</text>
    </g>

    <text x="40" y="290" class="lbl">CLOUD &amp; DEVOPS</text>
    <g transform="translate(40,302)">
      <rect class="chipBg" width="76" height="20" rx="6"/><text x="38" y="14" text-anchor="middle" font-size="11" class="chip">Docker</text>
      <rect class="chipBg" x="84" width="118" height="20" rx="6"/><text x="143" y="14" text-anchor="middle" font-size="11" class="chip">GitHub Actions</text>
      <rect class="chipBg" x="210" width="76" height="20" rx="6"/><text x="248" y="14" text-anchor="middle" font-size="11" class="chip">Vercel</text>
      <rect class="chipBg" x="294" width="84" height="20" rx="6"/><text x="336" y="14" text-anchor="middle" font-size="11" class="chip">Cloudflare</text>
    </g>
  </g>
</svg>

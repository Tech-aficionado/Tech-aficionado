<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h    { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f5f3ff; }
      .lbl  { font: 600 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8d87ad; letter-spacing: 1px; }
      .val  { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e3e0f5; }
      .acc  { fill: #9D7CFF; }
    </style>
    <clipPath id="portraitClip">
      <rect x="0" y="0" width="176" height="176" rx="20"/>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="20" fill="#0d0e14"/>
  <rect x="2" y="2" width="896" height="256" rx="18" fill="none" stroke="#2a2440" stroke-width="2"/>

  <text x="40" y="44" class="h">ID card</text>

  <g transform="translate(40,64)">
    <rect width="180" height="180" rx="22" fill="#15121f" stroke="#9D7CFF" stroke-width="2"/>
    <g transform="translate(2,2)" clip-path="url(#portraitClip)">
      <image href="data:image/png;base64," x="0" y="0" width="176" height="176" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="248" y="90" class="lbl">NAME</text>
    <text x="248" y="112" class="val">Shivansh Goel</text>

    <text x="248" y="142" class="lbl">ROLE</text>
    <text x="248" y="164" class="val">Full-Stack &amp; Mobile Developer</text>

    <text x="520" y="90" class="lbl">STATUS</text>
    <text x="520" y="112" class="val">Final-year B.Tech CSE student</text>

    <text x="520" y="142" class="lbl">LOCATION</text>
    <text x="520" y="164" class="val">Muzaffarnagar, UP, India</text>

    <text x="248" y="204" class="lbl">ID</text>
    <text x="248" y="224" class="val" font-family="Consolas, monospace">GH-TECH-AFICIONADO</text>

    <circle cx="860" cy="210" r="5" class="acc"/>
    <text x="800" y="214" text-anchor="end" class="lbl">OPEN TO OPPORTUNITIES</text>
  </g>
</svg>

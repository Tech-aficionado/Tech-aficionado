name: skyline

on:
  # run automatically every night
  schedule:
    - cron: "17 3 * * *"

  # allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # generate the animated ASCII-city SVG from the contribution graph
      - name: Draw skyline
        env:
          # falls back to the built-in Actions token when no PAT secret is set
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          go run github.com/pinkpixel-dev/skyline@latest -theme synthwave -svg dist/skyline.svg "${{ github.repository_owner }}"

      # publish into the SAME output branch the snake workflow uses, keeping
      # existing files on the branch so the two SVGs coexist instead of
      # clobbering each other
      - name: Publish skyline.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
